services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: securityadvisor
      POSTGRES_USER: securityadvisor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securityadvisor -d securityadvisor"]
      interval: 5s
      timeout: 5s
      retries: 12
  web:
    build: .
    environment: &app_environment
      NEWS_ALLOWED_HOSTS: ${NEWS_ALLOWED_HOSTS:-feeds.feedburner.com,www.bleepingcomputer.com,www.darkreading.com}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_HOST: db
      POSTGRES_DB: securityadvisor
      POSTGRES_USER: securityadvisor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - evidence_data:/app/private-evidence
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
  news_scanner:
    build: .
    command: ["python", "manage.py", "scan_news", "--loop"]
    restart: unless-stopped
    environment: *app_environment
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  evidence_data:
