name: Application tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  django:
    name: Django tests (PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: securityadvisor_ci
          POSTGRES_USER: securityadvisor_ci
          POSTGRES_PASSWORD: synthetic-ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U securityadvisor_ci -d securityadvisor_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DJANGO_SECRET_KEY: synthetic-ci-key-not-for-deployment
      DJANGO_DEBUG: "true"
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_DB: securityadvisor_ci
      POSTGRES_USER: securityadvisor_ci
      POSTGRES_PASSWORD: synthetic-ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --verbosity 2

  browsers:
    name: Browser forms (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      DJANGO_SECRET_KEY: synthetic-browser-ci-key-not-for-deployment
      DJANGO_DEBUG: "true"
      DATABASE_ENGINE: sqlite
      E2E_BROWSER: ${{ matrix.browser }}
      E2E_ARTIFACT_DIR: test-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python manage.py test e2e.browser_suite --verbosity 2
      - name: Upload synthetic browser traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.browser }}
          path: test-artifacts/
          if-no-files-found: warn
          retention-days: 7
